groups:
- name: node_exporter
  rules:
  - alert: HostOutOfMemory
    expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < .10)
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Host ou of memory {{ $labels.instance }}
      description: "Node memory is filling up (< 10% left)\n VALUE = {{ $value }}\n LABELS = {{ $labels }}"
  
  - alert: Host Memory under preasure
    expr: (rate(node_vmstat_pgmajfault[5m]) > 1000)
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host memory under preasure {{ $labels.instance }}
      description: High rate of loading pages from disk 

  - alert: HostMemoryUnderutilization
    expr: min_over_time(node_memory_MemFree_bytes[1w]) > node_memory_MemTotal_bytes * .8
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host Mmory not utilizated (instance {{ $labels.instance }})
      description: Node memory usage < 20% for 1 week
  
  - alert: Host recieve to much ingress traffik 
    expr: ((rate(node_network_receive_bytes_total[5m])/ on(instance, device) node_network_speed_bytes) > .80)
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host recieve to much ingress traffik 
      description: Host receive bandwidth ig high (>80%) \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: Host transmit to much egress traffik 
    expr: ((rate(node_network_transmit_bytes_total[5m])/ on(instance, device) node_network_speed_bytes) > .80)
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host transmit to much egress traffik 
      description: Host transit bandwidth ig high (>80%) \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: HostUnusualDiskRate
    expr: (rate(node_disk_io_time_seconds_total[5m]) > .80)
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host to much  IO rate for disk 
      description: Host disk is busy (>80%) \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: DiskOutOfSpace
    expr: (node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"}/ node_filesystem_size_bytes < .90 and on (instance , device, mountpoint) node_filesystem_readonly == 0)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Host disk to fill
      description: Host disk is out (fill > 90%) \n VALUE = {{ $value }}\n LABELS = {{ $labels }}

  - alert: DiskMayFillin24Hours
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"}[3h],86400) <= 0 and node_filesystem_avail_bytes > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Host disk to fill in 24 hour
      description: Host disk is out for 24 hour \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: Fail Disk
    expr: node_filesystem_device_error{fstype!~"^(fuse.*|tmpfs|cifs|nfs)"} == 1
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: host disk device error (instance {{ $labels.instance }})
      description: Error stat in (instance {{ $labels.mountpoint }}) \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: HighCPULoad
    expr: 1 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > .80
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host high CPU load (instance {{ $labels.instance }})
      description: CPU load > 80% \n VALUE = {{ $value }}\n LABELS = {{ $labels }}

  - alert: LowCPULoad
    expr: (min by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1h]))) > 0.8
    for: 1w
    labels:
      severity: warning
    annotations:
      summary: Host low CPU load (instance {{ $labels.instance }})
      description: CPU load < 20% \n VALUE = {{ $value }}\n LABELS = {{ $labels }}

  - alert: LowCPUHighToWait
    expr: avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.1
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: Host  CPU long wait disk (instance {{ $labels.instance }})
      description: CPU iowait > 10%. yopur CPU is idling wait for storage \n VALUE = {{ $value }}\n LABELS = {{ $labels }}
  
  - alert: HostTimeNotSync
    expr: (min_over_time(node_timex_sync_status[1m]) == 0 and node_timex_maxerror_seconds > 16)
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Host Clock not sync
      description: Ensure NTP is configured on this host \n VALUE = {{ $value }}\n LABELS = {{ $labels }}